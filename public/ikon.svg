<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nakhoda">
  <!-- Lambang ukuran besar: layar rumah, PWA, apple-touch.
       Kotak merah penuh dengan jangkar putih kertas, sama dengan favicon.
       Versi sebelumnya memakai dasar kertas, bingkai hairline, dan garis
       kepala merah seperti .kepala-panel. Di layar rumah iOS bingkai itu
       dipotong sudut bulat sehingga ikonnya terbaca sebagai selembar kertas,
       bukan lambang. Bahasa papan instrumen tetap dibawa jangkarnya: gores
       lurus, ujung persegi, sudut nol. Kotaknya sengaja tanpa sudut membulat
       karena iOS dan Android memotongnya sendiri. -->
  <rect width="512" height="512" fill="#b8261f"/>
  <g transform="translate(256 262) scale(15) translate(-12 -11.5)"
     fill="none" stroke="#fdf7f6" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="9.5" y="2" width="5" height="5"/>
    <path d="M12 7V21M7 10.5H17"/>
    <path d="M4 13.5V16L12 21L20 16V13.5"/>
  </g>
</svg>
