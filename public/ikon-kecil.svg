<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Nakhoda">
  <!-- Varian lambang untuk ukuran tab dan favicon.
       Bukan duplikat malas dari ikon.svg: pada 16px bingkai hairline dan
       garis kepala di ikon.svg jatuh di bawah satu piksel dan jadi bubur.
       Di sini kotaknya diisi merah penuh supaya terbaca di tab terang maupun
       gelap, goresnya ditebalkan, dan jangkarnya dibesarkan sampai hampir
       menyentuh tepi. -->
  <rect width="24" height="24" fill="#b8261f"/>
  <g transform="translate(12 12.4) scale(0.86) translate(-12 -12)"
     fill="none" stroke="#fdf7f6" stroke-width="2.9" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="9" y="1.8" width="6" height="5"/>
    <path d="M12 6.8V21M6.5 10.8H17.5"/>
    <path d="M3.5 13.5V16.2L12 21.5L20.5 16.2V13.5"/>
  </g>
</svg>
